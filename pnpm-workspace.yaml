packages:
  - "apps/*"
  - "packages/*"

# Bind declaration imports to each consumer's React types, not private hoists.
packageExtensions:
  "next@15.5.27":
    peerDependencies:
      "@types/react": "^18.2.0 || ^19.0.0"
      "@types/react-dom": "^18.2.0 || ^19.0.0"
    peerDependenciesMeta:
      "@types/react":
        optional: true
      "@types/react-dom":
        optional: true
  "@tanstack/react-query@5.101.4":
    peerDependencies:
      "@types/react": "^18.2.0 || ^19.0.0"
    peerDependenciesMeta:
      "@types/react":
        optional: true

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
