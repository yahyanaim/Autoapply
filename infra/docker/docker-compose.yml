services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: applyai
      POSTGRES_PASSWORD: applyai_dev
      POSTGRES_DB: applyai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applyai -d applyai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://applyai:applyai_dev@postgres:5432/applyai
      REDIS_URL: redis://redis:6379
      # Do not let an env_file value turn the public API into a worker too.
      APP_PROCESS_ROLE: api
      AI_EXECUTION_ROLE: all
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: "no"
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://applyai:applyai_dev@postgres:5432/applyai
    command:
      - /app/node_modules/.bin/prisma
      - migrate
      - deploy
      - --schema
      - /app/src/database/prisma/schema.prisma
    depends_on:
      postgres:
        condition: service_healthy

  # The Free worker is a separate process so it can only consume the Free
  # queue. It shares local uploads for development; production workers use
  # private object storage instead.
  resume-worker-free:
    build:
      context: ../..
      dockerfile: infra/docker/free-worker.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://applyai:applyai_dev@postgres:5432/applyai
      REDIS_URL: redis://redis:6379
      APP_PROCESS_ROLE: worker
      AI_EXECUTION_ROLE: free
      FREE_AI_PROVIDER: glm
    volumes:
      - api_uploads:/app/uploads
    stop_grace_period: 150s
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The paid worker uses the same verified API artifact, but its explicit role
  # prevents it from initializing or consuming the Free queue.
  resume-worker-paid:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://applyai:applyai_dev@postgres:5432/applyai
      REDIS_URL: redis://redis:6379
      APP_PROCESS_ROLE: worker
      AI_EXECUTION_ROLE: paid
    volumes:
      - api_uploads:/app/uploads
    # The API image checks its HTTP listener. A worker deliberately has none,
    # so use a process-liveness check instead.
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 150s
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  dashboard:
    build:
      context: ../..
      dockerfile: infra/docker/dashboard.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  api_uploads:
