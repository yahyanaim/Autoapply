apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-worker-paid
  labels:
    app: resume-worker-paid
spec:
  replicas: 1
  # Process queued jobs to a clean stopping point before a replacement starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: resume-worker-paid
  template:
    metadata:
      labels:
        app: resume-worker-paid
    spec:
      # Provider timeouts can be 120 seconds. Leave time for Worker.close() to
      # finish the active job before Kubernetes sends SIGKILL.
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: resume-worker-paid
          image: applyai-api
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          # Workers intentionally bind no HTTP listener.
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - process.kill(1, 0)
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: NODE_ENV
              value: production
            - name: APP_PROCESS_ROLE
              value: worker
            - name: AI_EXECUTION_ROLE
              value: paid
            - name: STORAGE_DRIVER
              value: s3
          # This secret contains only shared worker values, object-storage
          # access, and the paid-provider configuration. It must not contain
          # GLM credentials or Stripe credentials.
          envFrom:
            - secretRef:
                name: resume-worker-paid-secrets
