name: Apply repair code

on:
  push:
    branches:
      - agent/complete-repair-plan
    paths:
      - .github/workflows/apply-repair-code.yml

permissions:
  contents: write

jobs:
  apply-repair-code:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tested code and documentation repairs
        shell: bash
        run: |
          git apply --index repair-code.patch
          git rm complete-repair-plan.patch repair-code.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete security and reliability repair plan"
          git push
