name: Verify Vercel production release

on:
  deployment_status:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-vercel-release.yml
      - scripts/verify-production-smoke*.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-vercel-release.yml
      - scripts/verify-production-smoke*.mjs

permissions:
  contents: read

jobs:
  smoke-contract:
    name: Production smoke regression tests
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check scripts/verify-production-smoke.mjs
      - run: node --test scripts/verify-production-smoke.test.mjs

  smoke-test:
    name: Smoke-test deployed production origins
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production – autoapply' ||
       github.event.deployment.environment == 'Production – autoapply-api')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: production-smoke-${{ github.event.deployment.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Execute trusted default-branch code, never a deployment-supplied ref.
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify independently deployed production services
        run: node scripts/verify-production-smoke.mjs
        env:
          PRODUCTION_DASHBOARD_URL: ${{ vars.PRODUCTION_DASHBOARD_URL }}
          PRODUCTION_NORI_API_URL: ${{ vars.PRODUCTION_NORI_API_URL }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          PRODUCTION_PRODUCT_API_STATE: ${{ vars.PRODUCTION_PRODUCT_API_STATE || 'deferred' }}
