name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality, tests, and production builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: applyai
          POSTGRES_PASSWORD: applyai_test
          POSTGRES_DB: applyai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applyai -d applyai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://applyai:applyai_test@localhost:5432/applyai_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: integration-test-jwt-secret-at-least-32-characters
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit:dependencies

      - name: Generate Prisma client
        run: pnpm --filter @applyai/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Migrate integration database
        run: pnpm --filter @applyai/api prisma:migrate:deploy

      - name: Integration test
        run: pnpm --filter @applyai/api test:integration

      - name: Build
        run: pnpm build
